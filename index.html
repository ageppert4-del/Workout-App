<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Workout App</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#182033;--muted:#667085;--line:#d9dee8;--blue:#2563eb;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;background:rgba(246,247,251,.98);border-bottom:1px solid var(--line);padding:14px 14px 10px;z-index:9}
h1{font-size:1.25rem;margin:0} .sub{color:var(--muted);font-size:.9rem;margin-top:4px;line-height:1.35}
.wrap{max-width:900px;margin:0 auto;padding:12px 14px 32px} .tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px}
.tab{border:1px solid var(--line);background:white;color:var(--text);padding:12px 14px;border-radius:999px;font-weight:800;cursor:pointer;min-width:84px}
.tab.active{background:var(--blue);color:white;border-color:var(--blue)} .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 22px rgba(16,24,40,.07);margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start} .badge{display:inline-block;background:#e8f0ff;color:var(--blue);padding:6px 10px;border-radius:999px;font-size:.78rem;font-weight:800}
.progress{height:12px;border-radius:999px;background:#edf0f5;overflow:hidden;margin-top:10px} .bar{height:100%;width:0;background:var(--green);transition:.2s}
.exercise{border-top:1px solid var(--line);padding:14px 0} .exercise:first-child{border-top:0}
.exhead{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center} .check{width:38px;height:38px;accent-color:var(--green)} .name{font-weight:900;font-size:1.03rem} .target{color:var(--muted);font-size:.92rem;margin-top:3px}
.more{border:0;background:transparent;color:var(--blue);font-weight:900;padding:10px 0 0;cursor:pointer} .details{margin-left:58px;margin-top:8px;display:none} .details.open{display:block}
svg{width:100%;max-width:360px;display:block;background:#f8fafc;border:1px solid var(--line);border-radius:14px;margin:8px 0 10px} .fig *{fill:none;stroke:#111827;stroke-width:6;stroke-linecap:round;stroke-linejoin:round} .arr{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round} text{font:13px system-ui;fill:#475467;font-weight:700}
.steps{margin:8px 0 0;padding-left:22px} .steps li{margin:6px 0} .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:1rem;background:white;color:var(--text)} textarea{min-height:90px;resize:vertical;margin-top:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px} button.action{border:1px solid var(--line);background:white;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer} .primary{background:var(--green)!important;color:white;border-color:var(--green)!important} .danger{color:var(--red)}
.install{background:#eef6ff;border:1px solid #bfdbfe;color:#1e3a8a}
@media(max-width:620px){.fields{grid-template-columns:1fr}.top{display:block}.details{margin-left:0}}
</style>
</head>
<body>
<header><h1>Workout App</h1><div class="sub">Sunday-start lifting/cardio tracker. Install from Safari using Share → Add to Home Screen.</div></header>
<div class="wrap">
<div class="card install"><b>Install on iPhone/iPad:</b><div class="sub">Open this page in Safari, tap Share, then tap <b>Add to Home Screen</b>. After that, launch it like a normal app.</div></div>
<div class="tabs" id="tabs"></div>
<div class="card"><div class="top"><div><h2 id="dayTitle" style="margin:0"></h2><div id="dayDesc" class="sub"></div></div><span id="dayType" class="badge"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="count" class="sub"></div></div>
<div class="card" id="list"></div>
<div class="card"><b>Session notes</b><textarea id="notes" placeholder="Energy, pain, weights to increase next time, skipped exercises, etc."></textarea><div class="btns"><button class="action primary" onclick="save()">Save</button><button class="action" onclick="allDone()">Mark day complete</button><button class="action danger" onclick="resetDay()">Reset day</button><button class="action danger" onclick="resetAll()">Reset all</button></div></div>
</div>

42 105 L120 126 M168 105 L192 126\"/></g><path class=\"arr\" d=\"M50 28 C85 12 115 12 142 28\"/><text x=\"150\" y=\"178\" text-anchor=\"middle\">Bike</text></svg>", "Friday|Optional Ab Machine": "<svg viewBox=\"0 0 300 185\"><g class=\"fig\"><circle cx=\"150\" cy=\"48\" r=\"14\"/><path d=\"M150 62 L150 112 L124 146 M150 112 L176 146\"/><path d=\"M150 78 L112 92 M150 78 L188 92\"/><circle cx=\"105\" cy=\"94\" r=\"5\"/><circle cx=\"195\" cy=\"94\" r=\"5\"/><line x1=\"82\" y1=\"154\" x2=\"218\" y2=\"154\"/></g><path class=\"arr\" d=\"M50 28 C85 12 115 12 142 28\"/><text x=\"150\" y=\"178\" text-anchor=\"middle\">Optional Ab Machine</text></svg>", "Friday|Walk or Mobility": "<svg viewBox=\"0 0 300 185\"><g class=\"fig\"><circle cx=\"150\" cy=\"48\" r=\"14\"/><path d=\"M150 62 L150 112 L124 146 M150 112 L176 146\"/><path d=\"M150 78 L112 92 M150 78 L188 92\"/><circle cx=\"105\" cy=\"94\" r=\"5\"/><circle cx=\"195\" cy=\"94\" r=\"5\"/><line x1=\"82\" y1=\"154\" x2=\"218\" y2=\"154\"/></g><path class=\"arr\" d=\"M50 28 C85 12 115 12 142 28\"/><text x=\"150\" y=\"178\" text-anchor=\"middle\">Walk</text></svg>", "Saturday|Light Walk": "<svg viewBox=\"0 0 300 185\"><g class=\"fig\"><circle cx=\"150\" cy=\"48\" r=\"14\"/><path d=\"M150 62 L150 112 L124 146 M150 112 L176 146\"/><path d=\"M150 78 L112 92 M150 78 L188 92\"/><circle cx=\"105\" cy=\"94\" r=\"5\"/><circle cx=\"195\" cy=\"94\" r=\"5\"/><line x1=\"82\" y1=\"154\" x2=\"218\" y2=\"154\"/></g><path class=\"arr\" d=\"M50 28 C85 12 115 12 142 28\"/><text x=\"150\" y=\"178\" text-anchor=\"middle\">Light Walk</text></svg>", "Saturday|Stretching": "<svg viewBox=\"0 0 300 185\"><g class=\"fig\"><circle cx=\"150\" cy=\"48\" r=\"14\"/><path d=\"M150 62 L150 112 L124 146 M150 112 L176 146\"/><path d=\"M150 78 L112 92 M150 78 L188 92\"/><circle cx=\"105\" cy=\"94\" r=\"5\"/><circle cx=\"195\" cy=\"94\" r=\"5\"/><line x1=\"82\" y1=\"154\" x2=\"218\" y2=\"154\"/></g><path class=\"arr\" d=\"M50 28 C85 12 115 12 142 28\"/><text x=\"150\" y=\"178\" text-anchor=\"middle\">Stretching</text></svg>", "Saturday|No Structured Lifting": "<svg viewBox=\"0 0 300 185\"><g class=\"fig\"><circle cx=\"150\" cy=\"48\" r=\"14\"/><path d=\"M150 62 L150 112 L124 146 M150 112 L176 146\"/><path d=\"M150 78 L112 92 M150 78 L188 92\"/><circle cx=\"105\" cy=\"94\" r=\"5\"/><circle cx=\"195\" cy=\"94\" r=\"5\"/><line x1=\"82\" y1=\"154\" x2=\"218\" y2=\"154\"/></g><path class=\"arr\" d=\"M50 28 C85 12 115 12 142 28\"/><text x=\"150\" y=\"178\" text-anchor=\"middle\">No Structured Lifting</text></svg>"};
const KEY="workout-pwa-v1"; let current="Sunday";
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));}
function data(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function write(d){localStorage.setItem(KEY,JSON.stringify(d))}
function dayData(){return data()[current]||{items:[],notes:""}}
function renderTabs(){const t=document.getElementById("tabs");t.innerHTML="";Object.keys(PLAN).forEach(day=>{const b=document.createElement("button");b.className="tab"+(day===current?" active":"");b.textContent=day;b.onclick=()=>{current=day;render()};t.appendChild(b)})}
function render(){renderTabs();const p=PLAN[current],d=dayData();document.getElementById("dayTitle").textContent=current;document.getElementById("dayDesc").textContent=p.desc;document.getElementById("dayType").textContent=p.type;document.getElementById("notes").value=d.notes||"";const done=p.exercises.filter((_,i)=>d.items?.[i]?.done).length;const pct=Math.round(done/p.exercises.length*100);document.getElementById("bar").style.width=pct+"%";document.getElementById("count").textContent=`${done} of ${p.exercises.length} complete (${pct}%)`;const list=document.getElementById("list");list.innerHTML="";p.exercises.forEach((ex,i)=>{const item=d.items?.[i]||{};const div=document.createElement("div");div.className="exercise";div.innerHTML=`<div class="exhead"><input class="check" type="checkbox" id="done-${i}" ${item.done?"checked":""} onchange="save(false)"><div><div class="name">${ex[0]}</div><div class="target">${ex[1]}</div><button class="more" onclick="toggleDetails(${i})">Show picture + steps</button></div></div><div class="details" id="details-${i}">${SVGS[current+"|"+ex[0]]}<ol class="steps">${ex[2].map(s=>`<li>${s}</li>`).join("")}</ol><div class="fields"><input type="text" id="weight-${i}" value="${item.weight||""}" placeholder="Weight used" oninput="save(false)"><input type="text" id="actual-${i}" value="${item.actual||""}" placeholder="Actual sets/reps" oninput="save(false)"></div></div>`;list.appendChild(div)})}
function toggleDetails(i){document.getElementById("details-"+i).classList.toggle("open")}
function save(alertUser=true){const all=data(),p=PLAN[current];all[current]={notes:document.getElementById("notes").value,items:p.exercises.map((_,i)=>({done:document.getElementById("done-"+i)?.checked||false,weight:document.getElementById("weight-"+i)?.value||"",actual:document.getElementById("actual-"+i)?.value||""}))};write(all);if(alertUser)alert("Saved");render()}
function allDone(){PLAN[current].exercises.forEach((_,i)=>document.getElementById("done-"+i).checked=true);save(false)}
function resetDay(){const all=data();delete all[current];write(all);render()}
function resetAll(){if(confirm("Clear all saved workout data?")){localStorage.removeItem(KEY);render()}}
render();
</script>
